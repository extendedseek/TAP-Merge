[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-merge"
version = "0.1.0"
description = "Paper-derived reference implementation of trajectory-aligned projection-aware training and merging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
hf = ["transformers==4.46.3", "datasets==3.1.0", "huggingface-hub>=0.26,<1", "safetensors>=0.4,<1", "datasketch>=1.6,<2"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "build>=1,<2"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
tap-merge = "tap_merge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

